<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI 拍照助手 · Live（单文件版）</title>
<style>
  :root{--teal:#3fd6c0;--amber:#ffb454;--line:rgba(255,255,255,.16)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:#05080b;color:#eef5fa;
    font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #app{position:relative;height:100%;display:flex;flex-direction:column}

  /* 取景区 */
  #stage{position:relative;flex:1;background:#000;overflow:hidden}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #overlay{position:absolute;inset:0;width:100%;height:100%}

  .bar{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
       padding:12px 16px;font-size:13px;z-index:5}
  .bar.top{top:0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
  .bar.bottom{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom));
       background:linear-gradient(0deg,rgba(0,0,0,.62),transparent)}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
        background:rgba(10,18,26,.6);border:1px solid var(--line);backdrop-filter:blur(6px)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(63,214,192,.15)}
  .dot.off{background:#8a99a8;box-shadow:none}
  button{font:inherit;color:#eef5fa;background:rgba(10,18,26,.62);border:1px solid var(--line);
         border-radius:12px;padding:9px 14px;cursor:pointer;backdrop-filter:blur(6px)}
  button:active{transform:scale(.97)}
  button.primary{background:linear-gradient(180deg,#3fd6c0,#22a291);color:#04241f;border:0;font-weight:700}

  /* 提示条 */
  #hint{position:absolute;left:14px;right:14px;bottom:96px;padding:13px 16px;border-radius:14px;
        background:rgba(6,14,20,.8);border:1px solid var(--line);backdrop-filter:blur(8px);
        display:flex;gap:12px;align-items:center;opacity:0;transform:translateY(8px);transition:.25s;z-index:4}
  #hint.show{opacity:1;transform:none}
  #hint .ic{font-size:19px}
  #hint .main{font-size:18px;font-weight:600}
  #hint .sub{font-size:12px;color:#93a7b9;margin-top:2px}

  /* 快门 + 缩略图 */
  .shoot{display:flex;align-items:center;justify-content:center;position:relative;height:76px}
  #shutter{width:64px;height:64px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.32);cursor:pointer}
  #shutter:disabled{opacity:.4}
  #thumb{position:absolute;left:16px;width:52px;height:52px;border-radius:10px;object-fit:cover;
         border:2px solid rgba(255,255,255,.7);display:none;cursor:pointer}

  /* 拍后轻卡 */
  #review{position:absolute;left:14px;right:14px;bottom:96px;padding:14px 16px;border-radius:14px;
          background:rgba(9,18,26,.9);border:1px solid var(--line);backdrop-filter:blur(10px);
          display:none;z-index:6}
  #review.show{display:block}
  #review h3{margin:0 0 8px;font-size:15px}
  #review .row{font-size:13px;color:#c9d8e5;margin:4px 0}
  #review .row b{color:#fff}
  #review .acts{display:flex;gap:8px;margin-top:10px}
  #review .acts button{flex:1;text-align:center;padding:8px}

  /* 开场 */
  #gate{position:fixed;inset:0;z-index:20;background:radial-gradient(900px 600px at 50% 0%,#17334b,#070b0f 60%);
        display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  #gate.hide{display:none}
  #gate .box{max-width:460px}
  #gate h1{font-size:24px;margin:0 0 8px}
  #gate p{color:#b6c6d4;font-size:13px;margin:6px 0}
  #gate .warn{color:#ffcf8a}

  /* 灵感幽灵框提示 */
  #suggest{position:absolute;left:14px;right:14px;top:64px;padding:10px 14px;border-radius:12px;
           background:rgba(6,20,18,.82);border:1px solid rgba(63,214,192,.45);color:#bff0e8;
           font-size:13px;display:none;z-index:5}
  #suggest.show{display:block}

  /* 点击对焦框 */
  #focusRing{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border:2px solid #ffd479;
             border-radius:8px;pointer-events:none;display:none;z-index:7;
             box-shadow:0 0 0 1px rgba(0,0,0,.35), inset 0 0 12px rgba(255,212,121,.35)}
  #focusRing.pulse{animation:focusPulse .45s ease-out}
  @keyframes focusPulse{0%{transform:scale(1.35);opacity:.4}100%{transform:scale(1);opacity:1}}

  /* 首次引导 */
  #guide{position:absolute;inset:0;z-index:15;background:rgba(4,8,12,.78);backdrop-filter:blur(3px);
         display:none;align-items:center;justify-content:center;padding:22px}
  #guide.show{display:flex}
  #guide .card{max-width:420px;background:rgba(14,24,34,.96);border:1px solid rgba(255,255,255,.14);
               border-radius:18px;padding:20px 22px;text-align:left}
  #guide h2{font-size:17px;margin:0 0 12px}
  #guide ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.9;color:#cfdeea}
  #guide li{margin-bottom:6px}
  #guide .k{color:#3fd6c0;font-weight:700}
  #guide button{width:100%;margin-top:16px;padding:12px;border-radius:12px;font-weight:700;
                background:linear-gradient(180deg,#3fd6c0,#22a291);color:#04241f;border:0}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>

    <div class="bar top">
      <div class="pill"><span class="dot" id="dot"></span><span id="stateLabel">助手开</span></div>
      <div style="display:flex;gap:8px">
        <button id="btnSuggest">✨ 灵感</button>
        <button id="btnHelp" title="使用说明">?</button>
        <button id="btnFlip">切换</button>
        <button id="btnToggle">关闭</button>
      </div>
    </div>

    <div id="suggest"></div>
    <div id="focusRing"></div>

    <div id="hint">
      <div class="ic" id="hintIc">◐</div>
      <div>
        <div class="main" id="hintMain">准备中…</div>
        <div class="sub" id="hintSub"></div>
      </div>
    </div>

    <div id="review">
      <h3 id="rvTitle">拍完了</h3>
      <div class="row" id="rvGood"></div>
      <div class="row" id="rvTip"></div>
      <div class="acts">
        <button id="rvDownload">下载照片</button>
        <button id="rvClose">关闭</button>
      </div>
    </div>

    <div class="bar bottom">
      <div class="shoot">
        <img id="thumb" alt="最近一张" />
        <div id="shutter" title="拍照"></div>
      </div>
    </div>
  </div>
</div>

<div id="guide">
  <div class="card">
    <h2>怎么用</h2>
    <ol>
      <li><span class="k">点一下画面</span>：出现黄色对焦框，同时把这里记成"主体"，并画一条<span class="k">黄色主体虚线</span>。</li>
      <li><span class="k">白色水平虚线</span>：它是"水平参考"。转手机，让画面里的<span class="k">橙色水平线</span>与它平行，变<span class="k">绿色</span>就说明端平了。</li>
      <li><span class="k">蓝色虚线/框</span>：构图目标。让主体或顶部对齐它，对齐后变绿，表示构图到位。</li>
      <li>底部提示条每次只说一件事；不想被打扰就点右上角<span class="k">关闭</span>（对照组）。</li>
    </ol>
    <button id="btnGuideOk">知道了，开始拍</button>
  </div>
</div>

<div id="gate">
  <div class="box">
    <h1>AI 拍照助手 · 实拍版</h1>
    <p>用你的摄像头实时取景，检测地平线、光线和反光，在按快门之前给一句建议。</p>
    <p class="warn" id="secureWarn" style="display:none">⚠ 当前不是 HTTPS/localhost，浏览器不会给摄像头权限。</p>
    <p style="color:#8ea3b8;font-size:12px">画面只在本机处理，不上传。</p>
    <button class="primary" id="btnStart" style="margin-top:14px;width:100%;padding:12px">开启摄像头</button>
    <p id="status" style="margin-top:12px;font-size:12.5px;color:#9fb4c6;min-height:20px;text-align:left;white-space:pre-wrap"></p>
    <div id="errBox" style="display:none;margin-top:10px;padding:12px;border-radius:10px;
         background:rgba(224,102,102,.12);border:1px solid rgba(224,102,102,.4);text-align:left;font-size:12.5px;color:#ffb3b3"></div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button id="btnRetry" style="flex:1;padding:10px">重试</button>
      <button id="btnCamTest" style="flex:1;padding:10px" onclick="location.href='camtest.html'">摄像头自检</button>
    </div>
  </div>
</div>

<script>
/* ===== detect.js ===== */
/**
 * detect.js —— 纯计算模块（无 DOM，可在 Node 里单测）
 * 三个 cue：地平线倾斜 / 明暗 / 反光
 */

/** RGBA ImageData → 灰度 Uint8Array */
function toGray(data, w, h) {
  const g = new Uint8Array(w * h);
  for (let i = 0, p = 0; i < g.length; i++, p += 4) {
    // 0.299R + 0.587G + 0.114B
    g[i] = (data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8;
  }
  return g;
}

function weightedFit(pts) {
  let sw = 0, sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (const p of pts) {
    const w = p.w;
    sw += w; sx += w * p.x; sy += w * p.y;
    sxx += w * p.x * p.x; sxy += w * p.x * p.y;
  }
  const den = sw * sxx - sx * sx;
  if (Math.abs(den) < 1e-6) return { a: 0, b: sy / sw };
  const a = (sw * sxy - sx * sy) / den;
  const b = (sxx * sy - sx * sxy) / den;
  return { a, b };
}

function stddev(arr) {
  const m = arr.reduce((s, v) => s + v, 0) / arr.length;
  return Math.sqrt(arr.reduce((s, v) => s + (v - m) * (v - m), 0) / arr.length);
}

/**
 * 估计地平线倾斜角。
 * 做法：每列找“最强水平边”所在行 → 加权最小二乘拟合直线 → 内点筛选后重拟合。
 * @returns {{angleDeg:number, confidence:number, sampleCount:number}}
 */
function estimateHorizon(gray, w, h) {
  const pts = [];
  const minStrength = 12;
  const m = 2;

  for (let x = m; x < w - m; x++) {
    let bestG = 0, bestY = -1;
    for (let y = m; y < h - m; y++) {
      const i = y * w + x;
      const gy = Math.abs(gray[i - w] - gray[i + w]);        // 水平边响应
      const gx = Math.abs(gray[i - 1] - gray[i + 1]) * 0.25; // 抑制竖直边
      const g = gy - gx;
      if (g > bestG) { bestG = g; bestY = y; }
    }
    if (bestG >= minStrength && bestY > 0) pts.push({ x, y: bestY, w: bestG });
  }

  if (pts.length < w * 0.35) return { angleDeg: 0, confidence: 0, sampleCount: pts.length };

  let fit = weightedFit(pts);
  const resid = pts.map(p => Math.abs(p.y - (fit.a * p.x + fit.b)));
  const sd = stddev(resid);
  const keep = pts.filter((p, i) => resid[i] <= Math.max(2, 2 * sd));
  if (keep.length < w * 0.3) return { angleDeg: 0, confidence: 0, sampleCount: keep.length };

  fit = weightedFit(keep);
  const angleDeg = Math.atan(fit.a) * 180 / Math.PI;
  const cover = keep.length / w;
  const stable = sd < 3 ? 1 : Math.max(0.4, 3 / sd);
  const lineY = fit.a * (w / 2) + fit.b;          // 画面中心处的地平线高度
  return {
    angleDeg,
    confidence: Math.min(1, cover * 1.2) * stable,
    sampleCount: keep.length,
    lineY,                                        // 像素（分析分辨率下）
    lineYRatio: lineY / h,                        // 0=顶部 1=底部
    slope: fit.a,
  };
}

/** 明暗：平均亮度 + 高光溢出比例 + 暗部比例 */
function measureBrightness(gray) {
  let sum = 0, overflow = 0, dark = 0;
  for (let i = 0; i < gray.length; i++) {
    const v = gray[i];
    sum += v;
    if (v > 245) overflow++;
    if (v < 40) dark++;
  }
  const n = gray.length;
  return { meanLuma: sum / n, overflowRatio: overflow / n, darkRatio: dark / n };
}

/** 反光：高亮 + 低饱和像素占比 */
function detectGlare(data, w, h) {
  let n = 0, hits = 0;
  for (let p = 0; p < data.length; p += 4) {
    const r = data[p], g = data[p + 1], b = data[p + 2];
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const luma = (r * 77 + g * 150 + b * 29) >> 8;
    const sat = max === 0 ? 0 : (max - min) / max;
    n++;
    if (luma > 235 && sat < 0.12) hits++;
  }
  return { ratio: n ? hits / n : 0 };
}

/**
 * 审美信号（不是“错误”，只是“另一种可能”的线索）
 * @returns {{subjectHeight:number, subjectInFrame:boolean, borderClutter:number, symmetry:number, horizonRatio:number}}
 */
function computeAesthetics(gray, w, h, hz) {
  // 1) 主体：最暗的一团（演示场景里的人物是深色剪影）
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (gray[y * w + x] < 70) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  const found = maxX >= 0;
  const subjectHeight = found ? (maxY - minY) / h : 0;

  // 2) 背景杂乱：外圈 20% 区域的强梯度密度
  let edge = 0, total = 0;
  const bx = Math.round(w * 0.2), by = Math.round(h * 0.2);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const inBorder = x < bx || x > w - bx || y < by || y > h - by;
      if (!inBorder) continue;
      const i = y * w + x;
      const g = Math.abs(gray[i - 1] - gray[i + 1]) + Math.abs(gray[i - w] - gray[i + w]);
      if (g > 40) edge++;
      total++;
    }
  }
  const borderClutter = total ? edge / total : 0;

  // 3) 对称性：左右镜像差异
  let diff = 0, cnt = 0;
  for (let y = 0; y < h; y += 2) {
    for (let x = 0; x < w / 2; x += 2) {
      diff += Math.abs(gray[y * w + x] - gray[y * w + (w - 1 - x)]);
      cnt++;
    }
  }
  const symmetry = cnt ? 1 - Math.min(1, diff / cnt / 60) : 0;

  return {
    subjectHeight,
    subjectInFrame: found,
    borderClutter,
    symmetry,
    horizonRatio: hz ? hz.lineYRatio : 0.5,
  };
}

/**
 * 检测竖直线（建筑场景的核心信号：楼体立柱是否竖直 = 手机是否端平）
 * 与地平线检测对称：逐行找最强竖直边 → 拟合 x = a·y + b
 * @returns {{angleDeg:number, confidence:number, coverage:number}} angleDeg 为偏离竖直的角度
 */
function detectVerticals(gray, w, h) {
  const pts = [];
  const minStrength = 12;
  const m = 2;

  for (let y = m; y < h - m; y++) {
    let bestG = 0, bestX = -1;
    for (let x = m; x < w - m; x++) {
      const i = y * w + x;
      const gx = Math.abs(gray[i - 1] - gray[i + 1]);          // 竖直边响应
      const gy = Math.abs(gray[i - w] - gray[i + w]) * 0.25;   // 抑制水平边
      const g = gx - gy;
      if (g > bestG) { bestG = g; bestX = x; }
    }
    if (bestG >= minStrength && bestX > 0) pts.push({ x: bestX, y, w: bestG });
  }

  const coverage = pts.length / h;
  if (pts.length < h * 0.30) return { angleDeg: 0, confidence: 0, coverage };

  // 拟合 x 关于 y：把 (x,y) 转置成 (x'=y, y'=x)
  let fit = weightedFit(pts.map(p => ({ x: p.y, y: p.x, w: p.w })));
  const resid = pts.map(p => Math.abs(p.x - (fit.a * p.y + fit.b)));
  const sd = stddev(resid);
  const keep = pts.filter((p, i) => resid[i] <= Math.max(2, 2 * sd));
  if (keep.length < h * 0.25) return { angleDeg: 0, confidence: 0, coverage };

  fit = weightedFit(keep.map(p => ({ x: p.y, y: p.x, w: p.w })));
  const angleDeg = Math.atan(fit.a) * 180 / Math.PI;   // 偏离竖直方向的角度
  const cover = keep.length / h;
  const stable = sd < 3 ? 1 : Math.max(0.4, 3 / sd);
  return {
    angleDeg,
    confidence: Math.min(1, cover * 1.2) * stable,
    coverage: cover,
  };
}

/**
 * 天空占比 + 天空底边（建筑顶 ≈ 天空底边）
 * 判据：足够亮 + 偏蓝或低饱和
 */
function estimateSky(data, w, h) {
  const rowSky = new Array(h).fill(0);
  let total = 0;

  for (let y = 0; y < h; y++) {
    let cnt = 0;
    for (let x = 0; x < w; x++) {
      const p = (y * w + x) * 4;
      const r = data[p], g = data[p + 1], b = data[p + 2];
      const luma = (r * 77 + g * 150 + b * 29) >> 8;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      const sat = mx === 0 ? 0 : (mx - mn) / mx;
      const isSky = (luma > 140 && b >= r - 12 && sat < 0.45) || (luma > 210 && sat < 0.14);
      if (isSky) cnt++;
    }
    rowSky[y] = cnt / w;
    total += cnt;
  }

  // 从顶部往下，最后一个“过半是天空”的行
  let skyBottom = -1;
  for (let y = 0; y < h; y++) if (rowSky[y] >= 0.5) skyBottom = y;

  return {
    ratio: total / (w * h),
    skyBottom,
    skyBottomRatio: skyBottom < 0 ? 0 : skyBottom / h,
  };
}

/** 前景纹理：画面底部 1/3 的强梯度密度（有前景 = 画面有层次） */
function foregroundTexture(gray, w, h) {
  const y0 = Math.floor(h * 2 / 3);
  let edge = 0, total = 0;
  for (let y = y0 + 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const g = Math.abs(gray[i - 1] - gray[i + 1]) + Math.abs(gray[i - w] - gray[i + w]);
      if (g > 40) edge++;
      total++;
    }
  }
  return { density: total ? edge / total : 0 };
}

/**
 * 场景分类（规则版，无需模型）
 * building: 大量竖直线 + 有天空
 * landscape: 少竖直线 + 有天空
 */
function classifyScene({ vert, sky, hz, aes }) {
  const strongVert = vert && vert.coverage > 0.35 && vert.confidence > 0.35;
  const hasSky = sky && sky.ratio > 0.12;

  if (strongVert && hasSky) return 'building';
  if (!strongVert && hasSky && hz && hz.confidence > 0.3) return 'landscape';
  if (strongVert) return 'building';
  return 'other';
}

/* ===== aim.js ===== */
/**
 * aim.js —— 目标构图逻辑（纯函数，可在 Node 里单测）
 *
 * 思路：不判断“你错了”，而是给出一个可以达成的目标——
 *   建筑：一个目标框（整栋楼 + 顶部留白），让用户前后移动去套住它
 *   风景：一条目标线（地平线放到三分线），让用户抬/压手机去贴上它
 */
const RULES = {
  building: {
    skyBottomMin: 0.05,     // 建筑顶上方至少留 5% 天空（原 8%，放宽）
    skyBottomMax: 0.28,     // 天空超过 28% 才算"建筑太小"（原 22%）
    vertTolerance: 4.0,     // 竖线容差（原 2°，太严）
    frameInset: 0.06,       // 目标框左右内缩
  },
  landscape: {
    targets: [0.333, 0.667],
    tolerance: 0.08,        // 地平线容差（原 0.05）
  },
};

/**
 * @param {{scene:string, vert:object, sky:object, hz:object, fg:object}} m
 * @returns {{
 *   type:'frame'|'line'|null,
 *   scene:string,
 *   achieved:boolean,
 *   text:string,          // 一句引导（未达成）
 *   sub:string,           // 补充说明
 *   frame?:{x0:number,y0:number,x1:number,y1:number},
 *   line?:{y:number, current:number},
 *   progress:number       // 0..1，越接近 1 越接近达成
 * }}
 */
function buildAim(m) {
  if (!m) return { type: null, scene: 'other', achieved: false, text: '', sub: '', progress: 0 };

  if (m.scene === 'building') return buildingAim(m);
  if (m.scene === 'landscape') return landscapeAim(m);
  return { type: null, scene: m.scene || 'other', achieved: false, text: '', sub: '', progress: 0 };
}

function buildingAim(m) {
  const R = RULES.building;
  const skyBottom = (m.sky && typeof m.sky.skyBottomRatio === 'number')
    ? m.sky.skyBottomRatio
    : 0.14;
  const vertDeg = m.vert ? m.vert.angleDeg : 0;
  const vertConf = m.vert ? m.vert.confidence : 0;

  // 目标：天空结束的位置（楼顶）落在 [min,max] 区间
  const target = clamp(skyBottom, R.skyBottomMin, R.skyBottomMax);

  const problems = [];
  if (skyBottom < R.skyBottomMin) {
    problems.push({ key: 'top', text: '后退半步，把楼顶收进来', sub: '楼顶被切掉了，上方留一点天空' });
  } else if (skyBottom > R.skyBottomMax) {
    problems.push({ key: 'scale', text: '走近一点，让建筑占满画面', sub: '建筑有点小，靠近或变焦一点' });
  }
  if (vertConf > 0.35 && Math.abs(vertDeg) > R.vertTolerance) {
    problems.push({
      key: 'vert',
      text: vertDeg > 0 ? '手机往左转一点，让柱子竖直' : '手机往右转一点，让柱子竖直',
      sub: `竖线偏离 ${Math.abs(vertDeg).toFixed(1)}°，是仰拍造成的透视`,
    });
  }

  const achieved = problems.length === 0;
  // 进度：距离理想区间中点的接近程度
  const mid = (R.skyBottomMin + R.skyBottomMax) / 2;
  const progress = clamp(1 - Math.abs(skyBottom - mid) / 0.25, 0, 1);

  return {
    type: 'frame',
    scene: 'building',
    achieved,
    text: achieved ? '构图到位' : problems[0].text,
    sub: achieved ? '整栋楼在画面里，柱子是直的' : problems[0].sub,
    frame: {
      x0: R.frameInset,
      y0: target,                 // 楼顶应在的位置
      x1: 1 - R.frameInset,
      y1: 1,
    },
    line: null,
    vertDeg,
    skyBottom,
    progress,
  };
}

function landscapeAim(m) {
  const R = RULES.landscape;
  const current = m.hz && m.hz.confidence > 0.2 ? m.hz.lineYRatio : 0.5;

  // 就近选择一个三分线作为目标（不放正中）
  let target = R.targets.reduce((best, t) =>
    Math.abs(current - t) < Math.abs(current - best) ? t : best, R.targets[0]);

  const diff = current - target;
  const achieved = Math.abs(diff) <= R.tolerance && m.hz && m.hz.confidence > 0.2;

  let text = '', sub = '';
  if (!m.hz || m.hz.confidence <= 0.2) {
    text = '抬一点手机，让地平线进画面';
    sub = '还没找到明显的地平线';
  } else if (!achieved) {
    if (diff > 0) {
      text = '抬一点手机，把地平线抬上去';
      sub = `地平线在 ${(current * 100).toFixed(0)}%，目标在 ${(target * 100).toFixed(0)}%`;
    } else {
      text = '压一点手机，把地平线降下来';
      sub = `地平线在 ${(current * 100).toFixed(0)}%，目标在 ${(target * 100).toFixed(0)}%`;
    }
  } else {
    text = '构图到位';
    sub = target > 0.5 ? '地平线压到下面，天空成了主体' : '地平线抬到上面，地面成了主体';
  }

  return {
    type: 'line',
    scene: 'landscape',
    achieved,
    text,
    sub,
    frame: null,
    line: { y: target, current },
    progress: clamp(1 - Math.abs(diff) / 0.3, 0, 1),
  };
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

/** 场景显示名 */
const SCENE_LABEL = {
  building: '建筑',
  landscape: '风景',
  other: '通用',
};

/* ===== live.js ===== */
/**
 * live.js —— 实拍版：真实摄像头 + 实时检测 + 真的拍照
 * 复用 detect.js；所有画面计算都在本机完成，不上传。
 */


const AW = 320, AH = 240;            // 分析分辨率

const el = {
  video: document.getElementById('video'),
  overlay: document.getElementById('overlay'),
  dot: document.getElementById('dot'),
  stateLabel: document.getElementById('stateLabel'),
  hint: document.getElementById('hint'),
  hintIc: document.getElementById('hintIc'),
  hintMain: document.getElementById('hintMain'),
  hintSub: document.getElementById('hintSub'),
  suggest: document.getElementById('suggest'),
  shutter: document.getElementById('shutter'),
  thumb: document.getElementById('thumb'),
  review: document.getElementById('review'),
  rvTitle: document.getElementById('rvTitle'),
  rvGood: document.getElementById('rvGood'),
  rvTip: document.getElementById('rvTip'),
  rvDownload: document.getElementById('rvDownload'),
  rvClose: document.getElementById('rvClose'),
  btnStart: document.getElementById('btnStart'),
  btnToggle: document.getElementById('btnToggle'),
  btnFlip: document.getElementById('btnFlip'),
  btnSuggest: document.getElementById('btnSuggest'),
  btnHelp: document.getElementById('btnHelp'),
  focusRing: document.getElementById('focusRing'),
  guide: document.getElementById('guide'),
  btnGuideOk: document.getElementById('btnGuideOk'),
  gate: document.getElementById('gate'),
  status: document.getElementById('status'),
  errBox: document.getElementById('errBox'),
  btnRetry: document.getElementById('btnRetry'),
};

const octx = el.overlay.getContext('2d');
const work = Object.assign(document.createElement('canvas'), { width: AW, height: AH });
const wctx = work.getContext('2d', { willReadFrequently: true });

const S = {
  stream: null,
  track: null,         // 视频轨道（点击对焦用）
  focusMode: '',       // 设备报告的 focusMode 能力
  facing: 'environment',
  enabled: true,
  running: false,
  last: null,          // 最近一次 metrics
  lastPhoto: null,     // dataURL
  prompt: null,
  cooldown: {},
  lastAny: 0,
  fps: 0,
  shots: 0,
  aimOn: true,         // 目标引导（L2）开关
  scene: 'other',
  aim: null,
  sceneStable: 0,      // 场景连续命中次数，防抖
  sceneCandidate: 'other',
  focusPoint: null,    // 用户点击标记的主体位置 {x,y}（归一化 0..1），null=未标记
  promptShownAt: 0,    // 当前提示开始显示的时间（用于最小停留时长）
  lastCue: null,       // 上一个显示过的 cue（用于保持显示）
};

/* ---------------- 摄像头 ---------------- */
const ERR_TIP = {
  NotAllowedError: '权限被拒绝。点地址栏左侧的摄像头图标 → 允许；如果之前点过"阻止"，要先清除记录。',
  NotFoundError: '没有找到摄像头设备。检查设备管理器里摄像头是否被禁用。',
  NotReadableError: '摄像头被其他程序占用。关掉 Zoom / Teams / 微信视频 / 相机 App 再试。',
  OverconstrainedError: '分辨率要求不满足。点"重试"会用默认分辨率。',
  SecurityError: '安全上下文不足：必须通过 http://127.0.0.1 或 https 打开，不能直接双击 html。',
  AbortError: '启动被中断，点"重试"。',
  TypeError: '浏览器不支持摄像头 API（或页面不是 localhost/https）。',
};

function setStatus(t) { if (el.status) el.status.textContent = t; }
function showError(name, msg) {
  el.errBox.style.display = 'block';
  el.errBox.textContent = `⚠ ${name || '错误'}：${msg || ''}\n→ ${ERR_TIP[name] || '点"摄像头自检"查看详细信息。'}`;
}
function clearError() { el.errBox.style.display = 'none'; el.errBox.textContent = ''; }

async function openCamera(facing = S.facing) {
  clearError();

  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('❌ 当前页面不是安全上下文');
    showError('SecurityError', `协议 ${location.protocol}，需要 http://127.0.0.1 或 https`);
    return;
  }

  if (S.stream) S.stream.getTracks().forEach(t => t.stop());
  setStatus('① 正在请求摄像头权限…');

  const tries = [
    { video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
    { video: true, audio: false },
  ];

  let lastErr = null;
  for (let i = 0; i < tries.length; i++) {
    try {
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('TIMEOUT')), 8000));
      const stream = await Promise.race([navigator.mediaDevices.getUserMedia(tries[i]), timeout]);
      S.stream = stream;
      setStatus('② 已拿到视频流，正在启动预览…');
      el.video.srcObject = stream;
      await el.video.play();
      await waitForFrame(3000);
      fitOverlay();
      const t = stream.getVideoTracks()[0];
      S.track = t;                       // 保存轨道，后面点击对焦要用
      const st = t.getSettings ? t.getSettings() : {};
      setStatus(`✅ 摄像头已开启：${st.width || '?'}×${st.height || '?'}${i === 0 ? '' : '（已降级到默认分辨率）'}`);
      logEvent('camera', `focusMode=${(st.focusMode || '?')}`);
      t.addEventListener?.('ended', () => {
        S.running = false;
        setStatus('⚠ 摄像头被关闭了');
        showError('AbortError', '视频轨道结束（可能被其他程序抢占）');
        el.gate.classList.remove('hide');
      });
      if (!S.running) { S.running = true; requestAnimationFrame(loop); }
      return true;
    } catch (e) {
      lastErr = e;
      if (e && e.message === 'TIMEOUT') {
        setStatus('⏱ 8 秒没有响应');
        showError('NotReadableError', 'getUserMedia 一直没有返回，通常是摄像头被占用或驱动卡住');
        return false;
      }
      if (i === 0) { setStatus('① 首选参数失败，尝试默认参数…'); continue; }
    }
  }

  setStatus('❌ 开启失败');
  showError(lastErr && lastErr.name, lastErr && lastErr.message);
  return false;
}

function waitForFrame(ms = 3000) {
  return new Promise((resolve, reject) => {
    const t0 = performance.now();
    const check = () => {
      if (el.video.readyState >= 2 && el.video.videoWidth > 0) return resolve();
      if (performance.now() - t0 > ms) return reject(Object.assign(new Error('视频 3 秒内没有出帧（可能是虚拟摄像头或驱动问题）'), { name: 'NotReadableError' }));
      requestAnimationFrame(check);
    };
    check();
  });
}

function fitOverlay() {
  const r = el.video.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  el.overlay.width = Math.round(r.width * dpr);
  el.overlay.height = Math.round(r.height * dpr);
}

/* ---------------- 主循环 ---------------- */
let lastTs = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!S.running || el.video.readyState < 2) return;
  if (ts - lastTs < 1000 / 24) return;
  const dt = ts - lastTs; lastTs = ts;
  S.fps = S.fps ? S.fps * 0.9 + (1000 / dt) * 0.1 : 1000 / dt;

  wctx.drawImage(el.video, 0, 0, AW, AH);
  const img = wctx.getImageData(0, 0, AW, AH);
  const gray = toGray(img.data, AW, AH);

  const hz = estimateHorizon(gray, AW, AH);
  const br = measureBrightness(gray);
  const gl = detectGlare(img.data, AW, AH);
  const aes = computeAesthetics(gray, AW, AH, hz);
  const vert = detectVerticals(gray, AW, AH);
  const sky = estimateSky(img.data, AW, AH);
  const fg = foregroundTexture(gray, AW, AH);

  // 场景识别（连续 3 帧一致才切换，防抖）
  const cand = classifyScene({ vert, sky, hz, aes });
  if (cand === S.sceneCandidate) S.sceneStable++;
  else { S.sceneCandidate = cand; S.sceneStable = 1; }
  if (S.sceneStable >= 3 && S.scene !== cand) {
    S.scene = cand;
    logEvent('scene', cand);
  }

  S.last = { hz, br, gl, aes, vert, sky, fg, ts };

  // 平滑：目标框/目标线不要每帧乱跳（低通滤波）
  S.smooth = S.smooth || { skyBottom: null, lineY: null };
  const k = 0.18;
  if (sky.skyBottomRatio > 0) {
    S.smooth.skyBottom = S.smooth.skyBottom == null
      ? sky.skyBottomRatio
      : S.smooth.skyBottom + (sky.skyBottomRatio - S.smooth.skyBottom) * k;
  }
  if (hz.confidence > 0.2) {
    S.smooth.lineY = S.smooth.lineY == null
      ? hz.lineYRatio
      : S.smooth.lineY + (hz.lineYRatio - S.smooth.lineY) * k;
  }

  S.aim = S.aimOn ? buildAim({
    scene: S.scene,
    vert,
    sky: { ...sky, skyBottomRatio: S.smooth.skyBottom == null ? sky.skyBottomRatio : S.smooth.skyBottom },
    hz: { ...hz, lineYRatio: S.smooth.lineY == null ? hz.lineYRatio : S.smooth.lineY },
    fg,
  }) : null;

  const cue = decide(S.last, ts);
  draw(cue, S.last, S.aim);
  updateHint(cue, S.aim);
}

/* ---------------- 规则：默认层只纠错 ---------------- */
// 提示最小停留：条件恢复了也先显示完，避免"一闪而过"
const HOLD_CUE_MS = 3000;
const COOLDOWN_MS = 6000;     // 同类提示冷却
const GAP_MS = 12000;         // 任意两次提示之间的最小间隔

function decide(m, ts) {
  if (!S.enabled) return null;

  const cands = [];
  // 阈值都比之前宽松：宁可少提示，也不要一直滴滴响
  if (m.br.meanLuma < 55 && m.br.darkRatio > 0.45) cands.push('dark');
  if (m.gl.ratio > 0.10) cands.push('glare');
  if (Math.abs(m.hz.angleDeg) > 8 && m.hz.confidence >= 0.5) cands.push('tilt');

  const prio = ['dark', 'glare', 'tilt'];
  cands.sort((a, b) => prio.indexOf(a) - prio.indexOf(b));
  const top = cands[0] || null;

  // 没有新问题：如果当前提示还没显示够时长，继续显示
  if (!top) {
    if (S.prompt && ts - S.promptShownAt < HOLD_CUE_MS) return S.prompt;
    S.prompt = null;
    return null;
  }

  // 已经是同一条提示：继续显示（不重复触发冷却）
  if (S.prompt === top) return top;

  // 换提示前检查冷却与间隔
  if (ts - (S.cooldown[top] || 0) < COOLDOWN_MS) return S.prompt;
  if (ts - S.lastAny < GAP_MS) return S.prompt;

  S.cooldown[top] = ts;
  S.lastAny = ts;
  S.prompt = top;
  S.promptShownAt = ts;
  logEvent('prompt', top);
  return top;
}

const CUE = {
  tilt: { ic: '↺', main: '把水平线转正', sub: '让画面里的水平线（橙色）和白色虚线平行' },
  dark: { ic: '☀', main: '换个亮一点的地方', sub: '现在太暗，转向窗户或光源' },
  glare: { ic: '◐', main: '避开反光', sub: '画面里有强反光，侧一点角度再拍' },
};

function updateHint(cue, aim) {
  if (!S.enabled) {
    el.hint.classList.remove('show');
    el.hintMain.textContent = '助手已关闭';
    el.hintSub.textContent = '';
    return;
  }

  // ① 纠错优先（L1）：有基础问题时先说问题
  if (cue) {
    const c = CUE[cue];
    el.hintIc.textContent = c.ic;
    el.hintMain.textContent = c.main;
    el.hintSub.textContent = c.sub + (cue === 'tilt' && S.last ? `（当前 ${S.last.hz.angleDeg.toFixed(0)}°）` : '');
    el.hint.classList.add('show');
    return;
  }

  // ② 目标引导（L2）：没有错误时，给“拍得更好”的目标
  if (aim && aim.type && S.aimOn) {
    const tag = SCENE_LABEL[aim.scene] || '通用';
    el.hintIc.textContent = aim.achieved ? '✓' : (aim.type === 'frame' ? '▣' : '═');
    el.hintMain.textContent = aim.achieved ? `构图到位（${tag}）` : aim.text;
    el.hintSub.textContent = aim.sub + `　·　${tag}模式`;
    el.hint.classList.add('show');
    if (aim.achieved && !S._aimOkAt) S._aimOkAt = performance.now();
    if (!aim.achieved) S._aimOkAt = null;
    return;
  }

  // ③ 什么都没有：就绪（顺便告诉用户水平线状态）
  const ready = S.last && S.last.hz.confidence > 0.5;
  const levelOk = ready && Math.abs(S.last.hz.angleDeg) <= 2;
  el.hint.classList.toggle('show', !!ready);
  el.hintIc.textContent = levelOk ? '✓' : '—';
  el.hintMain.textContent = levelOk ? '水平线已对齐' : '画面就绪，可以拍了';
  el.hintSub.textContent = ready
    ? (levelOk ? '白色虚线与画面水平线平行' : `水平线偏 ${S.last.hz.angleDeg.toFixed(1)}°（转手机对齐白色虚线）`)
    : '点击画面标记主体，或直接对准目标';
}

/* ---------------- 叠加层 ---------------- */
function draw(cue, m, aim) {
  const W = el.overlay.width, H = el.overlay.height;
  const sx = W / AW, sy = H / AH;
  const dpr = window.devicePixelRatio || 1;
  octx.clearRect(0, 0, W, H);
  if (!S.enabled || !m) return;

  // ===== 水平线引导 =====
  // ① 目标水平线：画面正中的白色水平虚线（这就是"水平线"）
  // ② 实际水平线：检测到的画面里那条线（琥珀=歪，绿=正）
  // ③ 主体虚线：在主体那一行画一条水平虚线，让主体压上去
  const levelOk = m.hz.confidence > 0.35 && Math.abs(m.hz.angleDeg) <= 2;

  // ③ 主体目标虚线（在主体高度上）
  if (S.focusPoint) {
    const fy = S.focusPoint.y * H;
    octx.save();
    octx.setLineDash([14 * dpr, 10 * dpr]);
    octx.strokeStyle = 'rgba(255,212,121,.75)';
    octx.lineWidth = Math.max(1.6, 1.8 * dpr);
    octx.beginPath();
    octx.moveTo(0, fy); octx.lineTo(W, fy);
    octx.stroke();
    octx.restore();
    octx.fillStyle = 'rgba(255,212,121,.95)';
    octx.font = `${Math.round(11 * dpr)}px "Microsoft YaHei", sans-serif`;
    octx.textAlign = 'left';
    octx.fillText('主体线', 8 * dpr, fy - 6 * dpr);
  }

  // ① 目标水平线（居中，白色虚线）——对齐后变绿
  octx.save();
  octx.setLineDash([16 * dpr, 10 * dpr]);
  octx.strokeStyle = levelOk ? 'rgba(63,214,192,.95)' : 'rgba(255,255,255,.55)';
  octx.lineWidth = Math.max(1.8, 2 * dpr);
  octx.beginPath();
  octx.moveTo(0, H / 2); octx.lineTo(W, H / 2);
  octx.stroke();
  octx.restore();

  // ② 实际水平线（检测到的）
  if (m.hz.confidence > 0.3) {
    const { slope, lineY } = m.hz;
    octx.strokeStyle = levelOk ? 'rgba(63,214,192,.95)' : 'rgba(255,180,84,.9)';
    octx.lineWidth = Math.max(2, 2.4 * dpr);
    octx.beginPath();
    octx.moveTo(0, (lineY - slope * AW / 2) * sy);
    octx.lineTo(W, (lineY + slope * AW / 2) * sy);
    octx.stroke();

    // 两端小标签，告诉用户哪条是"实际水平线"
    octx.fillStyle = levelOk ? 'rgba(63,214,192,.95)' : 'rgba(255,180,84,.95)';
    octx.font = `${Math.round(11 * dpr)}px "Microsoft YaHei", sans-serif`;
    octx.textAlign = 'right';
    octx.fillText(levelOk ? '水平 ✓' : '水平线', W - 8 * dpr, (lineY + slope * AW / 2) * sy - 6 * dpr);
  }

  // 倾斜时的旋转箭头（纠错层）
  if (cue === 'tilt' && m) {
    const dir = m.hz.angleDeg > 0 ? '↺' : '↻';
    octx.fillStyle = 'rgba(255,180,84,.95)';
    octx.font = `bold ${Math.round(34 * dpr)}px "Microsoft YaHei", sans-serif`;
    octx.textAlign = 'center';
    octx.fillText(dir, W / 2, H / 2 - 18 * dpr);
  }

  // 目标引导（L2）：只有在没有纠错提示时才显示，避免同时两套指令
  if (aim && aim.type && !cue) drawAim(aim, W, H, dpr);

  // 用户点击标记的主体点：一直显示一个细十字，方便对齐
  if (S.focusPoint) {
    const fx = S.focusPoint.x * W, fy = S.focusPoint.y * H;
    const arm = 12 * dpr;
    octx.strokeStyle = 'rgba(255,212,121,.85)';
    octx.lineWidth = Math.max(1.5, 1.8 * dpr);
    octx.beginPath();
    octx.moveTo(fx - arm, fy); octx.lineTo(fx - arm / 3, fy);
    octx.moveTo(fx + arm / 3, fy); octx.lineTo(fx + arm, fy);
    octx.moveTo(fx, fy - arm); octx.lineTo(fx, fy - arm / 3);
    octx.moveTo(fx, fy + arm / 3); octx.lineTo(fx, fy + arm);
    octx.stroke();
    octx.beginPath();
    octx.arc(fx, fy, 3 * dpr, 0, Math.PI * 2);
    octx.fillStyle = 'rgba(255,212,121,.95)';
    octx.fill();
  }
}

/* ---------------- 目标引导绘制 ---------------- */
function drawAim(aim, W, H, dpr) {
  const ok = aim.achieved;
  const main = ok ? 'rgba(63,214,192,.95)' : 'rgba(120,190,255,.9)';
  const soft = ok ? 'rgba(63,214,192,.55)' : 'rgba(120,190,255,.45)';
  const lw = Math.max(2, Math.round(2.4 * dpr));

  if (aim.type === 'frame') {
    const f = aim.frame;
    const x0 = f.x0 * W, x1 = f.x1 * W;
    const y0 = f.y0 * H, y1 = f.y1 * H;

    // 目标框（虚线）
    octx.save();
    octx.setLineDash([10 * dpr, 8 * dpr]);
    octx.strokeStyle = soft;
    octx.lineWidth = lw;
    octx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    octx.restore();

    // 四角（达成时变绿加粗）
    const c = Math.min(34 * dpr, (x1 - x0) / 3);
    octx.strokeStyle = main;
    octx.lineWidth = lw * 1.4;
    octx.beginPath();
    // 左上
    octx.moveTo(x0, y0 + c); octx.lineTo(x0, y0); octx.lineTo(x0 + c, y0);
    // 右上
    octx.moveTo(x1 - c, y0); octx.lineTo(x1, y0); octx.lineTo(x1, y0 + c);
    // 左下
    octx.moveTo(x0, y1 - c); octx.lineTo(x0, y1); octx.lineTo(x0 + c, y1);
    // 右下
    octx.moveTo(x1 - c, y1); octx.lineTo(x1, y1); octx.lineTo(x1, y1 - c);
    octx.stroke();

    // 顶部留白线（楼顶应对齐这里）
    octx.save();
    octx.setLineDash([6 * dpr, 6 * dpr]);
    octx.strokeStyle = main;
    octx.lineWidth = lw;
    octx.beginPath();
    octx.moveTo(x0, y0); octx.lineTo(x1, y0);
    octx.stroke();
    octx.restore();

    // 竖线角度校正示意
    if (!ok && typeof aim.vertDeg === 'number' && Math.abs(aim.vertDeg) > 2) {
      const cx = W / 2, cy = H / 2, len = H * 0.18;
      const rad = aim.vertDeg * Math.PI / 180;
      octx.strokeStyle = 'rgba(255,180,84,.95)';
      octx.lineWidth = lw;
      octx.beginPath();
      octx.moveTo(cx - Math.sin(rad) * len, cy - Math.cos(rad) * len);
      octx.lineTo(cx + Math.sin(rad) * len, cy + Math.cos(rad) * len);
      octx.stroke();
      octx.beginPath();
      octx.moveTo(cx, cy - len); octx.lineTo(cx, cy + len);
      octx.strokeStyle = 'rgba(255,255,255,.35)';
      octx.stroke();
    }

  } else if (aim.type === 'line') {
    const yTarget = aim.line.y * H;
    const yCur = aim.line.current * H;

    // 目标线
    octx.save();
    octx.setLineDash([12 * dpr, 8 * dpr]);
    octx.strokeStyle = main;
    octx.lineWidth = lw;
    octx.beginPath();
    octx.moveTo(0, yTarget); octx.lineTo(W, yTarget);
    octx.stroke();
    octx.restore();

    // 当前地平线到目标线的指示箭头
    if (!ok) {
      const mid = W / 2;
      const up = yCur > yTarget;    // 当前在目标下方 → 需要往上（抬手机）
      const from = yCur, to = yTarget;
      octx.strokeStyle = soft;
      octx.lineWidth = lw;
      octx.beginPath(); octx.moveTo(mid, from); octx.lineTo(mid, to); octx.stroke();
      // 箭头
      const dir = Math.sign(to - from), half = 10 * dpr;
      octx.beginPath();
      octx.moveTo(mid, to);
      octx.lineTo(mid - half, to - dir * half);
      octx.lineTo(mid + half, to - dir * half);
      octx.closePath();
      octx.fillStyle = soft;
      octx.fill();
      // 文字
      octx.fillStyle = 'rgba(120,190,255,.95)';
      octx.font = `bold ${Math.round(14 * dpr)}px "Microsoft YaHei", sans-serif`;
      octx.textAlign = 'center';
      octx.fillText(up ? '抬手机 ↑' : '压手机 ↓', mid, to + (up ? 26 : -18) * dpr);
    }

    // 三分点提示
    octx.fillStyle = 'rgba(255,255,255,.25)';
    for (const t of [1 / 3, 2 / 3]) {
      octx.fillRect(0, t * H - 0.5, W, 1);
    }
  }
}

/* ---------------- 拍照 ---------------- */
function takePhoto() {
  if (!S.stream || el.video.readyState < 2) return;
  const c = document.createElement('canvas');
  c.width = el.video.videoWidth;
  c.height = el.video.videoHeight;
  c.getContext('2d').drawImage(el.video, 0, 0);

  const url = c.toDataURL('image/jpeg', 0.9);
  S.lastPhoto = url;
  S.shots++;
  el.thumb.src = url;
  el.thumb.style.display = 'block';

  const m = S.last;
  const good = [];
  const tips = [];
  if (m) {
    if (Math.abs(m.hz.angleDeg) < 2) good.push('地平线很稳');
    if (m.br.meanLuma >= 62 && m.br.meanLuma < 200) good.push('曝光正常');
    if (m.gl.ratio <= 0.06) good.push('没有明显反光');
    if (S.aim && S.aim.achieved) good.push(`${SCENE_LABEL[S.aim.scene]}构图到位`);
    if (!good.length) good.push('拍下来了就是第一步');

    if (Math.abs(m.hz.angleDeg) > 4) tips.push('下次把相机转正一些');
    else if (m.br.meanLuma < 62) tips.push('面向光源再拍一次会更亮');
    else if (m.gl.ratio > 0.06) tips.push('侧一点角度避开反光');
    else if (S.aim && S.aim.type && !S.aim.achieved) tips.push(S.aim.text);
    else {
      const s = pickSuggestion(m.aes);
      tips.push(s.text);
    }
  }
  el.rvTitle.textContent = `第 ${S.shots} 张`;
  el.rvGood.textContent = '✓ ' + good.slice(0, 2).join('、');
  el.rvTip.textContent = '→ ' + (tips[0] || '可以重拍一次对比');
  el.review.classList.add('show');
  el.suggest.classList.remove('show');
  logEvent('capture', { note: `tilt=${m ? m.hz.angleDeg.toFixed(1) : '?'}` });
}

el.rvDownload.addEventListener('click', () => {
  if (!S.lastPhoto) return;
  const a = document.createElement('a');
  a.href = S.lastPhoto;
  a.download = `photo-${Date.now()}.jpg`;
  a.click();
});
el.rvClose.addEventListener('click', () => el.review.classList.remove('show'));
el.thumb.addEventListener('click', () => el.rvDownload.click());

/* ---------------- 灵感层 ---------------- */
function pickSuggestion(aes) {
  if (!aes) return { text: '换个角度拍拍看' };
  if (aes.horizonRatio > 0.42 && aes.horizonRatio < 0.58) return { text: '把相机放低，让地平线高一些' };
  if (aes.borderClutter > 0.22) return { text: '往边上挪一步，让画面边缘干净些' };
  if (aes.symmetry > 0.86) return { text: '这张很对称，试试对准中线' };
  return { text: '蹲下来换个视角，同一场景会不一样' };
}

el.btnSuggest.addEventListener('click', () => {
  if (!S.enabled) { flashSuggest('助手已关闭，先重新开启'); return; }
  const s = pickSuggestion(S.last && S.last.aes);
  el.suggest.textContent = '✨ ' + s.text;
  el.suggest.classList.add('show');
  clearTimeout(s.timer);
  s.timer = setTimeout(() => el.suggest.classList.remove('show'), 6000);
  logEvent('suggest', s.text);
});

function flashSuggest(t) {
  el.suggest.textContent = t;
  el.suggest.classList.add('show');
  setTimeout(() => el.suggest.classList.remove('show'), 2500);
}

/* ---------------- 日志 ---------------- */
const events = [];
function logEvent(type, detail = '') {
  events.push({ t: Date.now(), type, detail });
  if (events.length > 200) events.shift();
}
window.__getLog = () => events;   // 控制台可拿

/* ---------------- 交互 ---------------- */
el.btnStart.addEventListener('click', async () => {
  const ok = await openCamera(S.facing);
  if (ok) el.gate.classList.add('hide');
});

el.btnRetry.addEventListener('click', async () => {
  S.facing = 'environment';
  const ok = await openCamera(S.facing);
  if (ok) el.gate.classList.add('hide');
});

el.btnToggle.addEventListener('click', () => {
  S.enabled = !S.enabled;
  el.btnToggle.textContent = S.enabled ? '关闭' : '开启';
  el.dot.className = 'dot' + (S.enabled ? '' : ' off');
  el.stateLabel.textContent = S.enabled ? '助手开' : '助手关';
  if (!S.enabled) { S.prompt = null; octx.clearRect(0, 0, el.overlay.width, el.overlay.height); }
  logEvent('toggle', S.enabled ? 'on' : 'off');
});

el.btnFlip.addEventListener('click', async () => {
  S.facing = S.facing === 'environment' ? 'user' : 'environment';
  try { await openCamera(S.facing); } catch (e) { flashSuggest('切换镜头失败：' + e.message); }
});

el.shutter.addEventListener('click', takePhoto);

/* ---------------- 点击标记主体 ---------------- */
// 说明：浏览器/WebView 无法控制硬件对焦，但点击位置可以当作"我要拍的主体"，
// 后续所有建议都围绕这个点来给（比自动猜主体更准）。
el.overlay.addEventListener('pointerdown', (e) => {
  if (!S.stream) return;
  const r = el.overlay.getBoundingClientRect();
  const x = clamp01((e.clientX - r.left) / r.width);
  const y = clamp01((e.clientY - r.top) / r.height);

  S.focusPoint = { x, y, at: performance.now() };

  // 黄色对焦框动画
  el.focusRing.style.left = (x * 100) + '%';
  el.focusRing.style.top = (y * 100) + '%';
  el.focusRing.style.display = 'block';
  el.focusRing.classList.remove('pulse');
  void el.focusRing.offsetWidth;      // 强制重排，让动画重播
  el.focusRing.classList.add('pulse');
  clearTimeout(el.focusRing._hide);
  el.focusRing._hide = setTimeout(() => { el.focusRing.style.display = 'none'; }, 1200);

  // 顺便清掉当前提示，让用户重新看构图
  S.prompt = null;

  // 尝试触发对焦，并给出可见反馈
  tryFocus(x, y).then((how) => {
    const msg = {
      point: '已对焦到该点',
      manual: '已手动对焦',
      'single-shot': '已重新对焦',
      continuous: '连续对焦中',
      unsupported: '此设备不支持点击对焦',
    }[how] || '';
    flashSuggest(`🎯 ${msg}`);
    logEvent('focus', `${x.toFixed(2)},${y.toFixed(2)} ${how}`);
  });

  logEvent('focus-point', `${x.toFixed(2)},${y.toFixed(2)}`);
});

function clamp01(v) { return Math.max(0, Math.min(1, v)); }

/* ---------------- 点击对焦（尽力而为） ----------------
 * WebView 的限制：W3C 规范里的点对焦是 `pointsOfInterest`，
 * 但 Chrome/Android WebView 基本不实现；能用的只有 focusMode。
 * 策略：按能力从强到弱尝试，全部失败就提示"设备不支持"。
 */
async function tryFocus(nx, ny) {
  const t = S.track;
  if (!t || !t.applyConstraints) return 'unsupported';

  let caps = {};
  try { caps = t.getCapabilities ? t.getCapabilities() : {}; } catch (e) { /* 忽略 */ }
  const modes = caps.focusMode || [];
  S.focusMode = modes.join(',');

  // ① 规范里的点对焦（几乎没实现，但试一下不亏）
  if (caps.pointsOfInterest !== undefined || modes.length === 0) {
    try {
      await t.applyConstraints({
        advanced: [{ pointsOfInterest: [{ x: nx, y: ny }] }],
      });
      return 'point';
    } catch (e) { /* 继续 */ }
  }

  // ② 手动对焦 + 距离（部分设备支持）
  if (modes.includes('manual') && caps.focusDistance) {
    try {
      await t.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: caps.focusDistance.max }] });
      setTimeout(() => {
        t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
      }, 1600);
      return 'manual';
    } catch (e) { /* 继续 */ }
  }

  // ③ 兜底：强制单次对焦，让镜头重新合焦一次
  if (modes.includes('single-shot')) {
    try {
      await t.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
      setTimeout(() => {
        t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
      }, 1600);
      return 'single-shot';
    } catch (e) { /* 继续 */ }
  }

  // ④ 切一下模式，逼某些机型重新对焦
  if (modes.includes('continuous')) {
    try {
      await t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      return 'continuous';
    } catch (e) { /* 继续 */ }
  }

  return 'unsupported';
}

/* ---------------- 使用说明 ---------------- */
function showGuide() { el.guide.classList.add('show'); }
function hideGuide() {
  el.guide.classList.remove('show');
  try { localStorage.setItem('pa.guideSeen', '1'); } catch (e) { /* 忽略 */ }
}
el.btnGuideOk.addEventListener('click', hideGuide);
el.btnHelp.addEventListener('click', showGuide);
el.guide.addEventListener('click', (e) => { if (e.target === el.guide) hideGuide(); });

// 首次进入自动展示一次
try {
  if (!localStorage.getItem('pa.guideSeen')) setTimeout(showGuide, 900);
} catch (e) { /* 忽略 */ }

window.addEventListener('resize', fitOverlay);
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); takePhoto(); }
  if (e.key === 'm' || e.key === 'M') el.btnToggle.click();
  if (e.key === 'f' || e.key === 'F') el.btnFlip.click();
  if (e.key === 'g' || e.key === 'G') {
    S.aimOn = !S.aimOn;
    flashSuggest(S.aimOn ? '目标引导：开' : '目标引导：关');
    logEvent('aim', S.aimOn ? 'on' : 'off');
  }
});

if (!window.isSecureContext || !navigator.mediaDevices) {
  document.getElementById('secureWarn').style.display = 'block';
  document.getElementById('secureWarn').textContent =
    location.protocol === 'file:'
      ? '⚠ 你是直接双击打开的 html：浏览器不会给摄像头权限。请用 run.py 启动后访问 http://127.0.0.1:端口/live.html'
      : '⚠ 当前不是 HTTPS/localhost，浏览器不会给摄像头权限。';
}
